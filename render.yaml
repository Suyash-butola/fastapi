# Free learning deployment. Render's free PostgreSQL expires after 30 days.
services:
  - type: web
    name: fastapi-course-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: uv sync --locked --no-dev
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fastapi-course-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        value: "[]"

databases:
  - name: fastapi-course-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: fastapi
    user: fastapi_app
    ipAllowList: []
